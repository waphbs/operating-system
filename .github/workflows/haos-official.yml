name: Build Houzzkit F1 Custom HAOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装必要依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 自动定位路径并构建
        run: |
          # 自动寻找包含 external.desc 的文件夹 (解决 image_edd08b.png 中的报错)
          REAL_EXT_PATH=$(find $(pwd) -name "external.desc" -exec dirname {} \; | head -n 1)
          if [ -z "$REAL_EXT_PATH" ]; then
            echo "❌ 错误：在仓库中找不到 external.desc 文件！"
            exit 1
          fi
          echo "✅ 找到真正的 External 路径: $REAL_EXT_PATH"
          
          # 自动寻找 houzzkit_f1_defconfig 的绝对路径
          CONF_FILE=$(find $(pwd) -name "houzzkit_f1_defconfig" | head -n 1)
          if [ -z "$CONF_FILE" ]; then
            echo "❌ 错误：找不到 houzzkit_f1_defconfig 配置文件！"
            exit 1
          fi
          echo "✅ 找到配置文件: $CONF_FILE"
          
          # 进入 buildroot 核心目录
          cd buildroot
          
          # 强制加载配置
          make BR2_EXTERNAL="$REAL_EXT_PATH" DEFCONFIG="$CONF_FILE" alldefconfig
          
          # 开始全力编译
          make BR2_EXTERNAL="$REAL_EXT_PATH" -j$(nproc) || echo "⚠️ 编译中断，准备提取核心零件"

      - name: 4. 暴力提取自定义零件
        if: always()
        run: |
          mkdir -p my_f1_system
          # 在整个 buildroot 目录下深度搜索 Image, dtb 和 rootfs
          find buildroot/ -name "Image" -exec cp {} my_f1_system/ \; || true
          find buildroot/ -name "*.dtb" -exec cp {} my_f1_system/ \; || true
          find buildroot/ -name "rootfs.squashfs" -exec cp {} my_f1_system/ \; || true
          
          echo "查看抓取到的自定义零件："
          ls -R my_f1_system/

      - name: 5. 发布下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System
          path: my_f1_system/
