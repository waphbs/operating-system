name: Build Custom HAOS F1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 智能雷达：自动寻找真实配置文件并编译
        run: |
          EXT_PATH=$(find $(pwd) -name "buildroot-external" -type d | head -n 1)
          echo "✅ 外部路径: $EXT_PATH"
          
          # 模糊搜索带有 houzzkit 的配置文件
          CONF_FILE=$(find "$EXT_PATH" -type f -name "*defconfig*" | grep -i "houzzkit" | head -n 1)
          
          if [ -z "$CONF_FILE" ]; then
            echo "❌ 错误：仓库里根本没有带 houzzkit 名字的配置文件！"
            echo "💡 别急，下面是仓库里所有的配置文件列表，请看日志，看看它到底叫什么："
            find "$EXT_PATH" -type f -name "*defconfig*"
            exit 1
          fi
          
          # 提取真正的文件名 (比如 haos_houzzkit_f1_defconfig)
          CONF_NAME=$(basename "$CONF_FILE")
          echo "✅ 成功找到真正的配置文件名: $CONF_NAME"
          
          cd buildroot
          # 用真正的名字去下达配置指令
          make BR2_EXTERNAL="$EXT_PATH" "$CONF_NAME"
          
          # 开始全力编译！
          make BR2_EXTERNAL="$EXT_PATH" -j$(nproc) || echo "⚠️ 编译打包可能中断，直接进入提取零件环节"

      - name: 4. 暴力提取自定义零件
        if: always()
        run: |
          mkdir -p my_custom_system
          find buildroot/output/images/ -name "Image" -exec cp {} my_custom_system/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} my_custom_system/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} my_custom_system/ \; || true
          
          echo "看看咱们抓到了什么零件："
          ls -R my_custom_system/

      - name: 5. 发送零件到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System
          path: my_custom_system/
