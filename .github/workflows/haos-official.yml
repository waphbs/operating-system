name: Build Houzzkit F1 HAOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装必要依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 强制链接配置文件并构建
        run: |
          # 1. 强制设定 External 路径为根目录
          EXT_PATH=$(pwd)
          
          # 2. 找到配置文件的绝对路径 (排除 buildroot 内部干扰)
          CONF_SRC=$(find $(pwd) -name "houzzkit_f1_defconfig" | grep -v "buildroot/support" | head -n 1)
          
          if [ -z "$CONF_SRC" ]; then
            echo "❌ 错误：仓库里真的没这个文件，请检查文件名！"
            exit 1
          fi
          echo "✅ 原始配置位于: $CONF_SRC"

          # 3. 【核心黑科技】强行把配置链接到 buildroot 自己的 configs 目录下
          # 这样你执行 make houzzkit_f1_defconfig 时，它绝对能找到
          mkdir -p buildroot/configs
          ln -sf "$CONF_SRC" buildroot/configs/houzzkit_f1_defconfig
          
          # 4. 进入构建
          cd buildroot
          make BR2_EXTERNAL="$EXT_PATH" houzzkit_f1_defconfig
          
          # 5. 开始编译
          make BR2_EXTERNAL="$EXT_PATH" -j$(nproc) || echo "⚠️ 编译中断，直接提取产物"

      - name: 4. 暴力提取自定义零件
        if: always()
        run: |
          mkdir -p output_parts
          find buildroot/output/images/ -name "Image" -exec cp {} output_parts/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} output_parts/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} output_parts/ \; || true
          ls -R output_parts/

      - name: 5. 发布下载
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System
          path: output_parts/
