name: Build Official HAOS for RK3568

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 wget perl tar rsync xz-utils libncurses5-dev
          sudo apt-get install -y qemu-utils python3-dev device-tree-compiler

      - name: Patch Hardware (Houzzkit F1 Special)
        run: |
          # 全盘搜索设备树文件并注入串口补丁
          find . -name "rk3568-evb1-v10.dts" -exec sed -i '/&uart2 {/i &uart3 { status = "okay"; pinctrl-names = "default"; pinctrl-0 = <&uart3m0_xfer>; };' {} +
          echo "Hardware patch applied."

      - name: Build HAOS
        run: |
          # 自动寻找编译脚本，解决 scripts 目录找不到的问题
          SCRIPT_PATH=$(find . -name "enter-usage" | head -n 1)
          if [ -n "$SCRIPT_PATH" ]; then
            chmod +x "$SCRIPT_PATH"
            $SCRIPT_PATH make haos-rk3568
          else
            echo "Warning: enter-usage not found, trying direct build..."
            cd buildroot
            make BR2_EXTERNAL=../buildroot-external haos_rk3568_defconfig
            make -j$(nproc)
          fi

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HAOS-RK3568-Houzzkit
          path: |
            output/images/*.img.xz
