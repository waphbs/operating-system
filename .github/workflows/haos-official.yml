name: Build Houzzkit F1 Custom HAOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 核心构建阶段
        run: |
          # 明确指定这个仓库里的 External 路径
          EXT_PATH=$(pwd)
          
          # 进入真正的 Buildroot 核心目录
          # 注意：这个仓库通常把 buildroot 当作子模块放在根目录
          cd buildroot
          
          # 强制指定配置文件路径（根据该仓库结构，配置在 configs/ 下）
          # 我们直接用全路径加载
          make BR2_EXTERNAL="$EXT_PATH" houzzkit_f1_defconfig
          
          # 开始全力编译，-j$(nproc) 加速
          make BR2_EXTERNAL="$EXT_PATH" -j$(nproc) || echo "编译中断，准备提取产物"

      - name: 4. 提取自定义系统零件
        if: always()
        run: |
          mkdir -p output_files
          # 寻找生成的内核和系统文件
          find buildroot/output/images/ -name "Image" -exec cp {} output_files/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} output_files/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} output_files/ \; || true
          
          echo "已抓取的零件列表："
          ls -R output_files/

      - name: 5. 发送零件到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Pure-Custom-System
          path: output_files/
