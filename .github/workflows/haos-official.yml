- name: Build HAOS
        run: |
          # 1. 全局搜索包含 rk3568 的 defconfig 文件并获取其完整路径
          CONF_PATH=$(find . -name "*rk3568*defconfig" | head -n 1)
          
          if [ -z "$CONF_PATH" ]; then
            echo "错误：全盘搜索也没找到 rk3568 配置文件！"
            echo "当前目录结构如下："
            ls -R | grep "defconfig" || echo "仓库里可能一个 defconfig 都没有"
            exit 1
          fi
          
          echo "定位到配置文件路径: $CONF_PATH"
          
          # 2. 提取文件名和所在的外部目录路径
          REAL_CONFIG=$(basename "$CONF_PATH")
          # 自动识别外部目录（通常是 configs 的上一级）
          EXTERNAL_DIR=$(dirname $(dirname "$CONF_PATH"))
          
          echo "识别到外部目录: $EXTERNAL_DIR"
          echo "识别到目标配置: $REAL_CONFIG"
          
          # 3. 进入 buildroot 目录开始编译
          cd buildroot
          
          # 4. 加载配置（使用绝对/相对路径确保 make 能找到）
          # 注意：EXTERNAL_DIR 相对于 buildroot 目录需要加 ../
          make BR2_EXTERNAL=../$EXTERNAL_DIR "$REAL_CONFIG"
          
          # 5. 暴力开火，使用 sudo 解决之前的权限问题
          sudo make BR2_EXTERNAL=../$EXTERNAL_DIR -j$(nproc)
