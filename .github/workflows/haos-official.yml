name: Build Custom HAOS F1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 寻找并配置构建选项
        run: |
          # 自动寻找 buildroot-external 文件夹的确切位置
          EXT_PATH=$(pwd)/buildroot-external
          if [ ! -d "$EXT_PATH" ]; then
            EXT_PATH=$(find $(pwd) -name "buildroot-external" -type d | head -n 1)
          fi
          echo "找到外部路径: $EXT_PATH"
          
          # 进入 buildroot 目录开始操作
          cd buildroot
          # 修复路径指向问题
          make BR2_EXTERNAL="$EXT_PATH" houzzkit_f1_defconfig
          
          # 开始编译 (设置超时或忽略错误以确保进入零件提取环节)
          make BR2_EXTERNAL="$EXT_PATH" -j$(nproc) || echo "编译中断，准备提取已有产物"

      - name: 4. 暴力提取自定义系统零件
        if: always()
        run: |
          mkdir -p custom_system_parts
          # 递归搜索所有编译生成的 Image, dtb 和 rootfs
          find . -name "Image" -exec cp {} custom_system_parts/ \; || true
          find . -name "*.dtb" -exec cp {} custom_system_parts/ \; || true
          find . -name "rootfs.squashfs" -exec cp {} custom_system_parts/ \; || true
          # 看看抓到了什么
          ls -R custom_system_parts/

      - name: 5. 将零件发布到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System-Files
          path: custom_system_parts/
