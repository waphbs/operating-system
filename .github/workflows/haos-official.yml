name: Build Custom HAOS F1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 寻找路径并强制配置
        run: |
          # 自动寻找外部配置文件夹和配置文件的绝对路径
          EXT_PATH=$(find $(pwd) -name "buildroot-external" -type d | head -n 1)
          CONF_FILE=$(find $(pwd) -name "houzzkit_f1_defconfig" | head -n 1)
          
          echo "外部路径: $EXT_PATH"
          echo "配置文件: $CONF_FILE"
          
          if [ -z "$CONF_FILE" ]; then
            echo "错误：在仓库中没找到 houzzkit_f1_defconfig"
            exit 1
          fi

          cd buildroot
          # 核心修正：使用配置文件全路径直接加载
          make BR2_EXTERNAL="$EXT_PATH" DEFCONFIG="$CONF_FILE" alldefconfig
          
          # 开始编译，-j$(nproc) 利用所有核心加速
          make BR2_EXTERNAL="$EXT_PATH" -j$(nproc) || echo "编译未完全结束，准备提取产物"

      - name: 4. 暴力提取核心零件
        if: always()
        run: |
          mkdir -p my_custom_system
          # 深度搜索已生成的内核、设备树和系统文件
          find buildroot/output/images/ -name "Image" -exec cp {} my_custom_system/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} my_custom_system/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} my_custom_system/ \; || true
          
          # 检查抓取结果
          ls -R my_custom_system/

      - name: 5. 发送零件到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System
          path: my_custom_system/
