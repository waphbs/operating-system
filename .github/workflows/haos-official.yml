name: Build Houzzkit F1 HAOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装必要依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 强制路径构建
        run: |
          # 关键点：对于这个开源库，根目录就是 EXTERNAL 路径
          EXT_PATH=$(pwd)
          
          # 寻找配置文件的相对路径 (跳过测试目录)
          # 目标通常就在根目录的 configs 文件夹下
          CONF_NAME="houzzkit_f1_defconfig"
          
          echo "✅ 使用外部路径: $EXT_PATH"
          
          cd buildroot
          
          # 直接下达指令，不再使用 DEFCONFIG 变量，让它在 EXTERNAL 路径下寻找
          make BR2_EXTERNAL="$EXT_PATH" "$CONF_NAME"
          
          # 开始全力编译
          make BR2_EXTERNAL="$EXT_PATH" -j$(nproc) || echo "⚠️ 编译中断，直接提取产物"

      - name: 4. 提取核心零件
        if: always()
        run: |
          mkdir -p output_parts
          # 寻找 Image, dtb 和 rootfs
          find buildroot/output/images/ -name "Image" -exec cp {} output_parts/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} output_parts/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} output_parts/ \; || true
          
          ls -R output_parts/

      - name: 5. 发布下载
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System
          path: output_parts/
