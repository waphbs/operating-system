name: Build Official HAOS for RK3568

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 wget perl tar rsync xz-utils libncurses5-dev
          sudo apt-get install -y qemu-utils python3-dev device-tree-compiler

      - name: Patch Hardware (Houzzkit F1 Special)
        run: |
          # 全盘搜索设备树文件并注入串口补丁
          find . -name "rk3568-evb1-v10.dts" -exec sed -i '/&uart2 {/i &uart3 { status = "okay"; pinctrl-names = "default"; pinctrl-0 = <&uart3m0_xfer>; };' {} +
          echo "Hardware patch applied."

      - name: Build HAOS
        run: |
          # 1. 进入 buildroot 目录
          cd buildroot
          
          # 2. 自动寻找真正的 defconfig 文件名
          # 官方可能叫 rk3568_defconfig 或者 haos_rk3568_defconfig
          REAL_CONFIG=$(find ../buildroot-external -name "*rk3568*defconfig" | head -n 1 | xargs basename)
          
          if [ -z "$REAL_CONFIG" ]; then
            echo "错误：在 buildroot-external 中找不到任何包含 rk3568 的配置文件！"
            ls -R ../buildroot-external/configs
            exit 1
          fi
          
          echo "发现目标配置文件: $REAL_CONFIG"
          
          # 3. 开始执行标准 Buildroot 编译流程
          make BR2_EXTERNAL=../buildroot-external "$REAL_CONFIG"
          
          # 4. 全力开火
          make -j$(nproc)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HAOS-RK3568-Houzzkit
          path: |
            output/images/*.img.xz
