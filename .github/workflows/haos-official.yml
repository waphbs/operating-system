name: Build HAOS for Houzzkit F1 (Standard/M1-Hybrid)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 wget perl tar rsync xz-utils libncurses5-dev
          sudo apt-get install -y qemu-utils python3-dev device-tree-compiler

      - name: Build HAOS
        run: |
          # 1. 寻找配置文件（保持上一版逻辑）
          CONF_PATH=$(find . -name "*haos_rk3568*defconfig" | head -n 1)
          if [ -z "$CONF_PATH" ]; then
            CONF_PATH=$(find . -name "*odroid_m1*defconfig" | head -n 1)
          fi
          
          REAL_CONFIG=$(basename "$CONF_PATH")
          EXTERNAL_REL_DIR=$(dirname $(dirname "$CONF_PATH"))
          EXTERNAL_DIR="../$EXTERNAL_REL_DIR"
          
          # 2. 核心修复：把所有权夺回来，不用 sudo 跑编译
          # 这样既有读写权限，又不会触发 "run as root" 的报错
          sudo chown -R runner:runner .
          
          # 3. 硬件补丁注入
          find . -name "*.dts" -exec sed -i '/&uart2 {/i &uart3 { status = "okay"; pinctrl-names = "default"; pinctrl-0 = <&uart3m0_xfer>; };' {} +

          # 4. 开始编译（不带 sudo）
          cd buildroot
          make BR2_EXTERNAL="$EXTERNAL_DIR" "$REAL_CONFIG"
          
          # 直接使用普通用户权限跑，加速编译
          make BR2_EXTERNAL="$EXTERNAL_DIR" -j$(nproc)
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HAOS-Houzzkit-F1-Custom
          path: |
            buildroot/output/images/*.img.xz
