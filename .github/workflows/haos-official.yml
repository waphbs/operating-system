name: Build Houzzkit F1 HAOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 安装必要依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 强制路径构建 (全手动档)
        run: |
          # 1. 直接锁定根目录
          ROOT_DIR=$(pwd)
          
          # 2. 检查配置文件是否存在 (手动列出 configs 目录确认)
          echo "检查配置目录内容："
          ls -R configs/ || echo "configs 目录不存在"
          
          # 3. 强行建立链接
          # 假设配置文件在根目录的 configs/houzzkit_f1_defconfig
          mkdir -p buildroot/configs
          cp configs/houzzkit_f1_defconfig buildroot/configs/houzzkit_f1_defconfig || \
          cp houzzkit_f1_defconfig buildroot/configs/houzzkit_f1_defconfig || \
          echo "⚠️ 警告：手动复制配置文件失败，尝试继续..."

          # 4. 进入构建
          cd buildroot
          # 告诉 Buildroot：外部配置就在上一层目录
          make BR2_EXTERNAL="$ROOT_DIR" houzzkit_f1_defconfig
          
          # 5. 开始正式编译
          make BR2_EXTERNAL="$ROOT_DIR" -j$(nproc) || echo "编译中断，准备提取"

      - name: 4. 提取成果
        if: always()
        run: |
          mkdir -p output_parts
          find buildroot/output/images/ -name "Image" -exec cp {} output_parts/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} output_parts/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} output_parts/ \; || true
          ls -R output_parts/

      - name: 5. 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Final-Result
          path: output_parts/
