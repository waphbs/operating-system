name: Build Custom HAOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip pycryptodome

      - name: Build HAOS Core
        run: |
          # 这一步是核心，咱们加上忽略错误的指令，保证能走到提取零件那一步
          make BR2_EXTERNAL=buildroot-external -C buildroot houzzkit_f1_defconfig
          make -C buildroot -j$(nproc) || echo "编译可能未完全打包，但核心文件应该已生成"

      - name: 暴力提取核心零件
        if: always()
        run: |
          mkdir -p my_parts
          # 寻找并拷贝 Image (内核), dtb (地图), rootfs (系统)
          find buildroot/output/images/ -name "Image" -exec cp {} my_parts/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} my_parts/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} my_parts/ \; || true

      - name: 发布零件到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System
          path: my_parts/
