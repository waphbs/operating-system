name: Build HAOS for Houzzkit F1 (Final Path Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 wget perl tar rsync xz-utils libncurses5-dev
          sudo apt-get install -y qemu-utils python3-dev device-tree-compiler

      - name: Build HAOS
        run: |
          # 1. 定位配置文件
          CONF_PATH=$(find . -name "*haos_rk3568*defconfig" | head -n 1)
          if [ -z "$CONF_PATH" ]; then
            CONF_PATH=$(find . -name "*odroid_m1*defconfig" | head -n 1)
          fi
          
          REAL_CONFIG=$(basename "$CONF_PATH")
          EXTERNAL_REL_DIR=$(dirname $(dirname "$CONF_PATH"))
          EXTERNAL_DIR="../$EXTERNAL_REL_DIR"
          
          # 2. 权限洗牌
          sudo chown -R runner:runner .
          
          # 3. 硬件补丁 (Houzzkit F1 UART3)
          find . -name "*.dts" -exec sed -i '/&uart2 {/i &uart3 { status = "okay"; pinctrl-names = "default"; pinctrl-0 = <&uart3m0_xfer>; };' {} +

          # 4. 进入编译目录
          cd buildroot
          
          # 5. 【核心修复】定义所有可能越界的路径环境变量
          # BR2_DL_DIR: 下载目录
          # CCACHE_DIR: 编译缓存目录，强制指向本地，防止去碰 /cache
          export BR2_DL_DIR="$(pwd)/dl"
          export CCACHE_DIR="$(pwd)/.ccache"
          mkdir -p $BR2_DL_DIR
          mkdir -p $CCACHE_DIR
          
          echo "=== 正在加载配置: $REAL_CONFIG ==="
          # 显式关闭配置中的全局 ccache 路径（如果存在），或强制重定向
          make BR2_EXTERNAL="$EXTERNAL_DIR" "$REAL_CONFIG"
          
          echo "=== 全力编译中（已封锁系统路径访问） ==="
          # 再次在 make 命令行中注入变量，确保万无一失
          make BR2_EXTERNAL="$EXTERNAL_DIR" \
               BR2_DL_DIR="$BR2_DL_DIR" \
               BR2_CCACHE_DIR="$CCACHE_DIR" \
               -j$(nproc)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HAOS-Houzzkit-F1-Final
          path: |
            buildroot/output/images/*.img.xz
