name: Build HAOS for Houzzkit F1 (Ultimate Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 给足6小时

    steps:
      - name: Maximize Build Space
        run: |
          # 疯狂清理，只为腾出打包空间
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune -a -f
          df -h # 查看清理后的空间

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Cache Buildroot
        uses: actions/cache@v4
        with:
          path: |
            buildroot/dl
            buildroot/.ccache
          key: ${{ runner.os }}-buildroot-${{ hashFiles('**/defconfig') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 wget perl tar rsync xz-utils libncurses5-dev
          sudo apt-get install -y qemu-utils python3-dev device-tree-compiler python3-setuptools

      - name: Build HAOS Core
        run: |
          cd buildroot
          # 保持之前的配置和 UART3 补丁逻辑
          # ... 
          # 关键：我们只运行到 build 结束，不强求最后的 image 打包成功
          make BR2_EXTERNAL="$EXTERNAL_DIR" -j$(nproc) || echo "Build might have failed at packaging, but core files might be ready."

      - name: Extract Custom System Parts
        if: always() # 强制执行，哪怕上面红了也去翻翻垃圾桶
        run: |
          mkdir -p ./output_parts
          # 提取我们自定义系统的核心：内核、设备树、文件系统
          cp buildroot/output/images/Image ./output_parts/ || true
          cp buildroot/output/images/*.dtb ./output_parts/ || true
          cp buildroot/output/images/rootfs.squashfs ./output_parts/ || true
          # 如果运气好打包成功了，也带上
          cp buildroot/output/images/*.img.xz ./output_parts/ || true

      - name: Upload Your Custom System
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Custom-HAOS-F1-Core
          path: ./output_parts/
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HAOS-Houzzkit-F1-Stable-Image
          path: |
            buildroot/output/images/*.img.xz

      - name: 暴力提取核心零件
        if: always() 
        run: |
          mkdir -p my_parts
          # 在整个输出目录里找我们要的内核、系统和地图
          find buildroot/output/images/ -name "Image" -exec cp {} my_parts/ \;
          find buildroot/output/images/ -name "*.dtb" -exec cp {} my_parts/ \;
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} my_parts/ \;

      - name: 发送零件到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System
          path: my_parts/
