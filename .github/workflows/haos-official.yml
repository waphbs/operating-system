name: Build Houzzkit F1 Custom HAOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (包含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装必要依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 执行 Houzzkit F1 专用构建
        run: |
          # 确定当前根目录就是 external 路径
          EXT_PATH=$(pwd)
          
          # 进入 buildroot 核心文件夹
          cd buildroot
          
          # 强制加载 Houzzkit F1 专用配置
          # 此时它会去根目录的 configs/ 找 houzzkit_f1_defconfig
          make BR2_EXTERNAL="$EXT_PATH" houzzkit_f1_defconfig
          
          # 开始全力编译
          make BR2_EXTERNAL="$EXT_PATH" -j$(nproc) || echo "编译可能在最后打包环节中断，准备提取核心零件"

      - name: 4. 暴力提取自定义零件
        if: always()
        run: |
          mkdir -p my_f1_system
          # 在编译输出目录里深度搜索我们的“自定义成果”
          find buildroot/output/images/ -name "Image" -exec cp {} my_f1_system/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} my_f1_system/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} my_f1_system/ \; || true
          
          echo "查看抓取到的自定义零件："
          ls -R my_f1_system/

      - name: 5. 将纯净自定义系统发布到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System-Files
          path: my_f1_system/
