name: Build Official HAOS for RK3568

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 wget perl tar rsync xz-utils libncurses5-dev
          sudo apt-get install -y qemu-utils python3-dev device-tree-compiler

      - name: Patch Hardware (Houzzkit F1 Special)
        run: |
          # 全盘搜索设备树文件并注入串口补丁
          find . -name "rk3568-evb1-v10.dts" -exec sed -i '/&uart2 {/i &uart3 { status = "okay"; pinctrl-names = "default"; pinctrl-0 = <&uart3m0_xfer>; };' {} +
          echo "Hardware patch applied."

      - name: Build HAOS
        run: |
          # 1. 打印目录结构（调试用，如果报错请截图这部分）
          echo "=== 正在检查配置文件目录 ==="
          ls -R buildroot-external/configs/ || echo "找不到 configs 目录"
          
          # 2. 强制进入 buildroot 并指定官方 RK3568 配置
          # 如果你的仓库是同步官方的，这个名字应该是绝对正确的
          cd buildroot
          
          echo "=== 开始尝试加载配置 ==="
          # 官方标准配置名通常是 haos_rk3568 或者 rk3568
          make BR2_EXTERNAL=../buildroot-external haos_rk3568_defconfig || \
          make BR2_EXTERNAL=../buildroot-external rk3568_defconfig || \
          make BR2_EXTERNAL=../buildroot-external odroid_m1_defconfig # 保底方案
          
          echo "=== 配置加载完成，开始编译 ==="
          make -j$(nproc)
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HAOS-RK3568-Houzzkit
          path: |
            output/images/*.img.xz
