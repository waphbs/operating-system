name: Build Custom HAOS F1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装编译环境 (已修复包名)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git rsync wget unzip python3-pycryptodome python3-dev python3-setuptools

      - name: 3. 开始构建自定义系统 (Houzzkit F1)
        run: |
          # 配置针对 F1 的编译选项
          make BR2_EXTERNAL=buildroot-external -C buildroot houzzkit_f1_defconfig
          # 开始正式编译，即使报错也继续，为了提取已经生成的零件
          make -C buildroot -j$(nproc) || echo "打包镜像可能失败，但核心零件可能已就绪"

      - name: 4. 暴力提取自定义系统零件
        if: always()
        run: |
          mkdir -p custom_system_parts
          # 寻找并拷贝 Image (自定义内核), dtb (硬件地图), rootfs (纯净HAOS系统)
          find buildroot/output/images/ -name "Image" -exec cp {} custom_system_parts/ \; || true
          find buildroot/output/images/ -name "*.dtb" -exec cp {} custom_system_parts/ \; || true
          find buildroot/output/images/ -name "rootfs.squashfs" -exec cp {} custom_system_parts/ \; || true
          # 检查一下有没有抓到零件
          ls -R custom_system_parts/

      - name: 5. 将零件发布到下载区
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Houzzkit-F1-Custom-System-Files
          path: custom_system_parts/
